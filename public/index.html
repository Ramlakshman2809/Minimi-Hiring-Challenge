<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat agent</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1c1b19; --muted: #77746d; --line: #e8e5df;
    --accent: #2f5d50; --accent-ink: #fff; --user: #efece6; --code: #f4f2ee; --chip: #eef3f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151513; --panel: #1c1b19; --ink: #ecebe6; --muted: #98958d; --line: #2d2c28;
      --accent: #7fb5a3; --accent-ink: #10221c; --user: #262522; --code: #232220; --chip: #1f2925; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header b { font-weight: 650; letter-spacing: -.01em; }
  header span { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 22px; }
  .msg.user .bubble { background: var(--user); border-radius: 16px 16px 4px 16px; padding: 10px 14px; margin-left: auto; width: fit-content; max-width: 88%; white-space: pre-wrap; }
  .msg.bot .bubble { padding: 0 2px; }
  .bubble > *:first-child { margin-top: 0; } .bubble > *:last-child { margin-bottom: 0; }
  .bubble p { margin: 0 0 .8em; } .bubble ul, .bubble ol { margin: 0 0 .8em; padding-left: 1.3em; } .bubble li { margin: .2em 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.02em; margin: 1.1em 0 .4em; }
  .bubble a { color: var(--accent); text-underline-offset: 2px; }
  .bubble code { background: var(--code); padding: .1em .35em; border-radius: 5px; font-size: .9em; }
  .bubble pre { background: var(--code); padding: 12px; border-radius: 10px; overflow-x: auto; } .bubble pre code { padding: 0; background: none; }
  .bubble table { border-collapse: collapse; width: 100%; font-size: .93em; margin: 0 0 .9em; display: block; overflow-x: auto; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .bubble th { background: var(--code); font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; margin: 0 0 10px; min-height: 20px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  .meta { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .meta details summary { cursor: pointer; list-style: none; display: inline-block; }
  .meta details summary::-webkit-details-marker { display: none; }
  .meta ol { margin: 6px 0 0; padding-left: 1.2em; } .meta a { color: var(--muted); }
  .empty { text-align: center; margin: 12vh auto 0; max-width: 560px; }
  .empty h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 6px; } .empty p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: flex; flex-direction: column; gap: 8px; }
  .chip { text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 14.5px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); background: var(--chip); }
  form { padding: 10px 16px 18px; }
  .box { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 8px 8px 8px 14px; }
  .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; max-height: 200px; padding: 6px 0; }
  button#send { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button#send:disabled { opacity: .45; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header><b>Chat agent</b><span id="clock"></span></header>
<main id="log"><div class="wrap" id="thread"></div></main>
<form id="form">
  <div class="box">
    <textarea id="input" rows="1" placeholder="Ask anything. I can search the web, and I remember our earlier chats." autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for a new line</div>
</form>
<script>
const $ = (s) => document.querySelector(s);
const log = $('#log'), thread = $('#thread'), input = $('#input'), sendBtn = $('#send');
const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return undefined; } })();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const rid = () => 'x' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
const qs = new URLSearchParams(location.search);
// ?u=demo adopts the seeded demo user (see `npm run seed`)
if (qs.get('u')) store.set('uid', qs.get('u'));
const userId = store.get('uid') || (store.set('uid', rid()), store.get('uid')) || rid();
let sessionId = rid();
let busy = false;

$('#clock').textContent = tz ? tz.replace('_', ' ') : '';

// ---- tiny, safe markdown ----
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      let code = ''; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code += lines[i++] + '\n';
      i++; out += `<pre><code>${esc(code)}</code></pre>`; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      const row = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out += '<table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        body.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { out += `<h3>${inline(h[2])}</h3>`; i++; continue; }
    if (/^\s*([-*•])\s+/.test(l)) {
      out += '<ul>'; while (i < lines.length && /^\s*([-*•])\s+/.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*([-*•])\s+/, ''))}</li>`; out += '</ul>'; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(l)) {
      out += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; out += '</ol>'; continue;
    }
    if (!l.trim()) { i++; continue; }
    let p = l; i++;
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*•]|\d+[.)])\s|\s*\|)/.test(lines[i])) p += '\n' + lines[i++];
    out += `<p>${inline(p).replace(/\n/g, '<br>')}</p>`;
  }
  return out;
}

// ---- UI ----
function empty() {
  thread.innerHTML = `<div class="empty"><h1>What can I find out for you?</h1>
    <p>Live web search, plus a dated memory of our past chats, so “what changed since Monday?” actually works.</p>
    <div class="chips">
      ${[
        'What is the best managed Postgres host for a small SaaS right now, and what does it cost?',
        'On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing or shipped something big since?',
        'What did I ask you on 3 November? Is your answer still correct today?',
      ].map((q) => `<button type="button" class="chip">${esc(q)}</button>`).join('')}
    </div></div>`;
  thread.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => { input.value = b.textContent; send(); }));
}
function add(role) {
  const m = document.createElement('div'); m.className = 'msg ' + role;
  m.innerHTML = '<div class="status"></div><div class="bubble"></div><div class="meta"></div>';
  thread.appendChild(m); return m;
}
const bottom = () => { log.scrollTop = log.scrollHeight; };
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 140;

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; input.value = ''; fit();
  if (thread.querySelector('.empty')) thread.innerHTML = '';
  const u = add('user'); u.querySelector('.status').remove(); u.querySelector('.meta').remove(); u.querySelector('.bubble').textContent = text;
  const b = add('bot');
  const status = b.querySelector('.status'), bubble = b.querySelector('.bubble'), meta = b.querySelector('.meta');
  status.innerHTML = '<span class="dot"></span><span class="t">Thinking…</span>';
  bottom();
  let raw = '', done = false;
  const setStatus = (t) => { const el = status.querySelector('.t'); if (el) el.textContent = t; };
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ userId, sessionId, message: text, tz }),
    });
    if (!res.ok || !res.body) throw new Error((await res.json().catch(() => ({}))).error || 'Request failed');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', pending = false;
    const paint = () => { pending = false; const stick = nearBottom(); bubble.innerHTML = md(raw); if (stick) bottom(); };
    while (true) {
      const { value, done: d } = await reader.read();
      if (d) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, k).trim(); buf = buf.slice(k + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'status') setStatus(ev.text);
        else if (ev.type === 'text') { raw += ev.text; setStatus('Writing…'); if (!pending) { pending = true; requestAnimationFrame(paint); } }
        else if (ev.type === 'sources') {
          const items = ev.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url)}</a></li>`).join('');
          meta.dataset.src = `<details><summary>${ev.sources.length} sources searched ▾</summary><ol>${items}</ol></details>`;
        }
        else if (ev.type === 'done') { done = true; meta.innerHTML = (meta.dataset.src || '') + `<div>${(ev.ms / 1000).toFixed(1)}s${ev.searches ? ` · ${ev.searches} search${ev.searches > 1 ? 'es' : ''}` : ''}</div>`; }
        else if (ev.type === 'error') { raw += (raw ? '\n\n' : '') + '⚠️ ' + ev.text; done = true; }
      }
    }
    bubble.innerHTML = md(raw);
  } catch (e) {
    bubble.innerHTML = md((raw ? raw + '\n\n' : '') + '⚠️ ' + (e.message || 'Connection lost.'));
  } finally {
    status.remove(); busy = false; sendBtn.disabled = false; input.focus(); bottom();
  }
}

function fit() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
input.addEventListener('input', fit);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#form').addEventListener('submit', (e) => { e.preventDefault(); send(); });
empty();
</script>
</body>
</html>
